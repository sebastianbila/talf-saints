<style>
/* Layout: one centred column "dossier" on a dark field, one question per screen, certificate reveal at the end */
:root{

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--ink);color:var(--txt);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;

.wrap{max-width:680px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:28px;min-height:100vh}

.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:500;font-size:16px;letter-spacing:.28em;text-transform:uppercase;

.opts.done .opt:not(.picked){opacity:.35;pointer-events:none}
.opt.right{background:#2c2414;border-color:var(--brass)}
.opt.wrong{background:#3a0f19;border-color:#c2465a}

<script>
const Q=[
 {q:"Who sends “Вийдем на каву? ☕️” more often?",o:["Me","Sebastian","Nobody. We just appear at the coffee spot"],c:0,v:"Correct. 38 invites against his 19. Certified coffee initiator.",w:"Wrong. It’s you: 38 coffee invites against his 19."},
 {q:"That coffee place grinds how many grams per shot?",o:["7","17","Who counts?"],c:1,v:"Correct. 17 grams. Only a true coffee nerd would know.",w:"Wrong. 17 grams. You told me yourself, coffee nerd."},
 {q:"Before coffee, your classic offer is…",o:["“Ідем до мене, накормлю”","“Let's skip breakfast”","“You're paying”"],c:0,v:"Correct. Feeding your bro first. A true saint.",w:"Wrong. Classic you: “Ідем до мене, накормлю.”"},
 {q:"Why can't Sebastian come out right now?",o:["Gym","A meeting","Sleeping"],c:1,v:"Correct. “Щас мітинг закінчу.” We know.",w:"Wrong. It’s always a meeting. “Щас мітинг закінчу.”"},
 {q:"Who's the voice-message guy?",o:["Me","Sebastian","We only text"],c:1,v:"Correct. 313 voice messages from him, 33 from you. He talks, you listen. Wisdom.",w:"Wrong. Sebastian: 313 voice messages. You: 33. He talks, you listen."},
 {q:"How many reels did we send each other?",o:["About 50","About 150","500+"],c:2,v:"Correct. 504 reels. Sebastian 302, you 209. The algorithm knows us better than our parents.",w:"Wrong. 504 reels. Sebastian 302, you 209. The algorithm knows us better than our parents."},
 {q:"Your signature reaction?",o:["“Ноооо”","“Чотко”","“Капець”"],c:0,v:"Correct. Ноооо. Your trademark. We counted.",w:"Wrong. It’s “Ноооо”. Your trademark. We counted."},
 {q:"Which word do you say way more than Sebastian?",o:["бро","чотко","норм"],c:0,v:"Correct. Бро. 56 against 11. He owns “чотко”: 31 to 0.",w:"Wrong. It’s “бро”: 56 against 11. He owns “чотко”: 31 to 0."},
 {q:"The skill Sebastian still can't hold?",o:["Front lever","Planche","Handstand"],c:1,v:"Not anymore bro 😁",w:"Wrong. The answer was the planche… and even that's outdated. Not anymore bro 😁"},
 {q:"When Sebastian said “I can't even hold the planche”, you replied…",o:["“Skill issue”","“Some days can be more difficult… they make you stronger”","“Just eat more”"],c:1,v:"Correct. Your words. And they worked.",w:"Wrong. You said: “Some days can be more difficult… they make you stronger.” And it worked."},
 {q:"Our record: most messages in one day?",o:["50","120","233"],c:2,v:"Correct. September 19. 67 videos filmed, a court booked and 233 messages.",w:"Wrong. 233. September 19: 67 videos filmed, a court booked, zero chill."},
 {q:"In the last six months, how many days did we NOT text each other?",o:["About 30","About 10","Zero"],c:2,v:"Correct. 184 days, 184 days of messages. Not one day off. Not even rest days.",w:"Wrong. Zero. 184 days in a row. Not even rest days."},
 {q:"How many messages did we send each other in six months?",o:["About 1,300","About 13,000","About 130,000"],c:1,v:"Correct. About 13,000. Basically a full-time job.",w:"Wrong. About 13,000. Basically a full-time job."},
 {q:"Who texts more?",o:["Me","Sebastian","Dead even"],c:0,v:"Correct. You, by about 1,500 messages.",w:"Wrong. You do, by about 1,500 messages."},
 {q:"Your mom's perfume that you love?",o:["Sauvage","Symphony","Baccarat"],c:1,v:"Correct. Symphony. Hold that thought.",w:"Wrong. It’s Symphony. Hold that thought."},
 {q:"Which perfume “smells like an old Merc with a leather interior”?",o:["Duro Nasomatto","Oud Wood","Your gym bag"],c:0,v:"Correct. From that “smell of big money” post I sent you. You were paying attention.",w:"Wrong. Duro Nasomatto. From that “smell of big money” post I sent you."},
 {q:"Who said “I love you bro” first?",o:["Me","Sebastian","Nobody. Real men send 🫶"],c:0,v:"Correct. October 6. You said it. Sebastian answered “Love you too 🫶🏼”.",w:"Wrong. It was you, on October 6. Sebastian answered “Love you too 🫶🏼”."},
 {q:"When you leave a room, what should people remember?",o:["The posture","The handshake","Something they can't quite name…"],v:"Exactly. Let's make it happen."}
];
let score=0;const scored=Q.filter(x=>x.c!==undefined).length;
const stage=document.getElementById('stage'),prog=document.getElementById('progress'),tag=document.getElementById('fileTag');
for(let i=0;i<Q.length;i++){prog.appendChild(document.createElement('i'))}
function setProg(n){[...prog.children].forEach((el,i)=>el.classList.toggle('on',i<n))}
function show(html){stage.innerHTML='<section class="screen">'+html+'</section>';const f=stage.querySelector('button');if(f)f.focus({preventScroll:true});window.scrollTo({top:0})}
function intro(){
  setProg(0);tag.textContent='Classified';
  show(`<div class="eyebrow">Birthday clearance required</div>
  <h1>Happy<em>Birthday</em></h1>
  <p class="lead">Something was prepared for you. Before we hand it over, we need to confirm you are the real TALF SAINTS. Eighteen questions. Get them wrong and we’ll know.</p>
  <button class="btn" id="go">Begin verification</button>`);
  document.getElementById('go').onclick=()=>{startMusic();ask(0)};
}
function ask(i){
  if(i===0)score=0;
  setProg(i);tag.textContent=`Question ${i+1} of ${Q.length}`;
  const it=Q[i];
  show(`<div class="qnum">${String(i+1).padStart(2,'0')} / ${String(Q.length).padStart(2,'0')}</div>
  <h2>${it.q}</h2>
  <div class="opts" id="opts">${it.o.map((t,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${t}</span></button>`).join('')}</div>
  <div id="after"></div>`);
  const opts=document.getElementById('opts');
  opts.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(opts.classList.contains('done'))return;
    const k=+b.dataset.k,has=it.c!==undefined,ok=!has||k===it.c;
    b.classList.add('picked',ok?'right':'wrong');opts.classList.add('done');setProg(i+1);
    if(has&&!ok){const r=opts.querySelector(`[data-k="${it.c}"]`);if(r)r.classList.add('answer')}
    if(has&&ok)score++;
    try{beep(ok?990:220,ok?.12:.25,.18)}catch(e){}
    const last=i===Q.length-1;
    document.getElementById('after').innerHTML=`<div class="screen" style="gap:18px"><p class="verdict ${ok?'':'bad'}">${ok?it.v:it.w}</p>
      <button class="btn" id="next">${last?'Open the file':'Next'}</button></div>`;
    const n=document.getElementById('next');n.focus({preventScroll:true});
    n.onclick=()=>last?granting():ask(i+1);
  });
}
function granting(){
  tag.textContent='Verifying…';
  show(`<div class="eyebrow">Analysing answers</div><h2 id="gl">Checking your file…</h2>`);
  const lines=[`Score: ${score}/${scored} correct`,'Discipline: confirmed','Wisdom: confirmed','Authenticity: confirmed','Identity: TalF Saints'];
  let k=0;const gl=document.getElementById('gl');
  const t=setInterval(()=>{gl.textContent=lines[k++];if(k===lines.length){clearInterval(t);setTimeout(archive,900)}},650);
}

let clip=null;
let actx=null;
const music=document.getElementById('music');
function duck(on){if(!music||music.paused)return;music.volume=on?.08:.45}
function beep(freq=880,dur=.12,vol=.25){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+dur)}catch(e){}}
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));voice=vs.find(v=>/(Daniel|Alex|Arthur|Aaron|Male|Google UK English Male)/i.test(v.name))||vs[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
/* Pre-recorded voice clips played through Web Audio: much lighter than the speech engine while the camera runs. */
const VMAP={'Get in position. Three.':'ready','Two.':'two','One.':'one','Hold the planche.':'hold','Keep it locked.':'locked','Five. Lean forward.':'five','Three.':'three','Now press. To handstand!':'press','Saint confirmed.':'confirmed','Happy birthday, TalF Saints!':'bday'};
const VOICE={};let curV=null,voiceLoading=false;
function loadVoice(){
  if(voiceLoading)return;voiceLoading=true;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){return}
  [...new Set(Object.values(VMAP))].forEach(k=>fetch('voice/'+k+'.mp3').then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>actx.decodeAudioData(b,ok,no))).then(buf=>{VOICE[k]=buf}).catch(()=>{}));
}
function say(t){
  const k=VMAP[t],b=k&&VOICE[k];
  if(b&&actx){try{if(actx.state==='suspended')actx.resume();if(curV){try{curV.stop()}catch(e){}}const src=actx.createBufferSource(),g=actx.createGain();g.gain.value=1.4;src.buffer=b;src.connect(g).connect(actx.destination);src.start();curV=src}catch(e){}return}
  if(window.musicHold)return; /* never use the heavy speech engine while recording */
  try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang='en-US';u.pitch=.85;speechSynthesis.speak(u)}catch(e){}
}

/* Countdown 3, hold 10, press. onEnd fires ~4.5s after "press". */
function sequence(tn,ts,onEnd){
  let n=3;tn.classList.remove('go');tn.textContent=n;ts.textContent='Get ready';duck(true);
  say('Get in position. Three.');beep(660);
  const pre=setInterval(()=>{n--; if(n>0){tn.textContent=n;say(n===2?'Two.':'One.');beep(660)}else{clearInterval(pre);hold()}},1000);
  const cues={7:'Keep it locked.',5:'Five. Lean forward.',3:'Three.',2:'Two.',1:'One.'};
  function hold(){
    let k=10;tn.textContent=k;tn.classList.add('go');ts.textContent='Hold the planche';
    say('Hold the planche.');beep(990,.25,.3);
    const h=setInterval(()=>{k--;tn.textContent=k;
      if(cues[k])say(cues[k]); if(k<=3&&k>0)beep(880);
      if(k<=0){clearInterval(h);beep(1320,.5,.35);
        tn.textContent='Press';ts.textContent='Now press to handstand';say('Now press. To handstand!',1.05);
        setTimeout(()=>say('Saint confirmed.'),3200);
        setTimeout(()=>{duck(false);onEnd&&onEnd()},4600);
      }},1000);
  }
}

const canLive=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
function uploadLink(t){return `<label class="linkish" for="cam">${t}<input id="cam" type="file" accept="video/*"></label>`}
function challenge(){
  tag.textContent='Final test';
  show(`<div class="eyebrow">One more moment</div>
  <h2>To prove you're the real TalF Saints…</h2>
  <ol class="steps"><li><b>01</b><span>Hold a full planche for 10 seconds.</span></li><li><b>02</b><span>Then press to handstand.</span></li><li><b>03</b><span>It all gets recorded. No proof, no gift.</span></li></ol>
  <p class="lead">Put your phone down so your whole body is in frame. The camera, the timer and the voice will guide you.</p>
  <div class="row">
    ${canLive?'<button class="btn" id="recLive">Start the test</button>':`<label class="btn rec" for="cam">Record or upload proof<input id="cam" type="file" accept="video/*"></label>`}
    <button class="ghost" id="useTimer">Practise first</button>
  </div>
  ${canLive?`<p class="note">Rather film it with your camera app? ${uploadLink('Upload a video instead')}</p>`:''}`);
  bindRec();
  if(canLive)document.getElementById('recLive').onclick=()=>record('user');
  document.getElementById('useTimer').onclick=timer;
}
function bindRec(){
  const c=document.getElementById('cam');if(!c)return;
  let err=document.getElementById('recErr');
  if(!err){err=document.createElement('p');err.id='recErr';err.className='err';err.setAttribute('role','alert');(c.closest('.row')||c.closest('p')).after(err)}
  const fail=t=>{err.textContent=t;c.value=''};
  c.onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;err.textContent='';
    const isVid=(f.type||'').startsWith('video/')||/\.(mp4|mov|m4v|webm|3gp|hevc|avi|mkv)$/i.test(f.name||'');
    if(!isVid){fail('That’s not a video. Photos don’t count, saint. Upload a video of the planche.');return}
    const v=document.createElement('video');v.preload='metadata';v.muted=true;const u=URL.createObjectURL(f);
    let done=false;const go=ok=>{if(done)return;done=true;URL.revokeObjectURL(u);if(ok){clip=f;verify()}};
    v.onloadedmetadata=()=>{const d=v.duration;if(isFinite(d)&&d<5){done=true;URL.revokeObjectURL(u);fail('Only '+Math.round(d)+' seconds? A 10-second planche needs a longer video.')}else go(true)};
    v.onerror=()=>go(true);setTimeout(()=>go(true),4000);v.src=u;
  };
}
let stream=null;
function stopStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function record(facing){
  tag.textContent='Recording';
  show(`<div class="cam-wrap"><video id="live" autoplay playsinline muted class="${facing==='user'?'mirror':''}"></video>
    <span class="recdot" id="recdot" hidden>REC</span>
    <div class="overlay"><p class="timer" id="tn">10</p><p class="tstate" id="ts">Whole body in frame? Tap start.</p></div></div>
  <div class="row" id="camCtl"><button class="btn" id="go" disabled>Start</button><button class="ghost" id="flip">Switch camera</button><button class="ghost" id="back">Back</button></div>
  <p class="err" id="camErr" role="alert"></p>`);
  const live=document.getElementById('live'),err=document.getElementById('camErr'),go=document.getElementById('go');
  document.getElementById('back').onclick=()=>{stopStream();challenge()};
  document.getElementById('flip').onclick=()=>{stopStream();record(facing==='user'?'environment':'user')};
  stopStream();
  const vid={facingMode:facing,width:{ideal:960},height:{ideal:540},frameRate:{ideal:30,max:30}};
  {try{stream=await navigator.mediaDevices.getUserMedia({video:vid,audio:false})}catch(e){
    const blocked=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
    err.innerHTML=(blocked?'Camera access is blocked. Allow the camera for this site in your browser settings and try again, or ':'The camera couldn’t start. ')+uploadLink('upload a video instead')+'.';
    bindRec();go.hidden=true;return}}
  live.srcObject=stream;go.disabled=false;
  go.onclick=()=>{
    const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mt=types.find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}})||'';
    let rec;const ro={videoBitsPerSecond:2500000};if(mt)ro.mimeType=mt;try{rec=new MediaRecorder(stream,ro)}catch(e){err.innerHTML='Recording isn’t supported here. '+uploadLink('Upload a video instead')+'.';bindRec();return}
    const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=()=>{const type=rec.mimeType||mt||'video/webm';const ext=/mp4/.test(type)?'mp4':'webm';
      clip=new File([new Blob(chunks,{type})],'talf-saints-proof.'+ext,{type});stopStream();window.musicHold=false;if(music&&typeof musicOn!=='undefined'&&musicOn)music.play().catch(()=>{});verify()};
    document.getElementById('camCtl').hidden=true;document.getElementById('recdot').hidden=false;
    window.musicHold=true;if(music)music.pause();
    rec.start(500);
    try{speechSynthesis.cancel()}catch(e){}
    sequence(document.getElementById('tn'),document.getElementById('ts'),()=>{try{rec.stop()}catch(e){}});
  };
}
function timer(){
  tag.textContent='Practice';
  show(`<div class="eyebrow">Practice run</div>
  <p class="timer" id="tn">10</p><p class="tstate" id="ts">Nothing is recorded. Tap start.</p>
  <div class="row" style="justify-content:center"><button class="btn" id="tgo" style="align-self:center">Start</button></div>`);
  const tn=document.getElementById('tn'),ts=document.getElementById('ts'),b=document.getElementById('tgo');
  b.onclick=()=>{b.hidden=true;sequence(tn,ts,()=>{b.hidden=false;b.textContent=canLive?'Ready. Start the test':'Ready. Upload proof';b.onclick=canLive?()=>record('user'):challenge})};
}
function verify(){
  tag.textContent='Verifying proof';
  show(`<div class="eyebrow">Verifying proof</div>
  <h2 id="vl">Analysing planche angle…</h2>
  <div class="progress" id="vbar" style="gap:0"><i style="flex:none;width:0%;background:var(--brass);transition:width 10s linear"></i></div>
  <p class="note">This takes about 10 seconds.</p>`);
  const steps=[[0,'Analysing planche angle…'],[2200,'Checking lockout and lean…'],[4400,'Measuring press to handstand…'],[6400,'Sending to sebii_sw…'],[8000,'sebii_sw is reviewing…'],[9300,'sebii_sw says: legit.']];
  steps.forEach(([t,x])=>setTimeout(()=>{const el=document.getElementById('vl');if(el)el.textContent=x},t));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const i=document.querySelector('#vbar i');if(i)i.style.width='100%'}));
  setTimeout(()=>{beep(1320,.4,.3);proof()},10200);
}
function proof(){
  tag.textContent='Approved';
  const url=URL.createObjectURL(clip);
  show(`<div class="eyebrow">Proof approved</div>
  <h2>Verified. That's the real TalF Saints.</h2>

}

const Q_BG=[null,'duo-wall',null,'duo-walk','crouch',null,'duo-car',null,'jacket',null,'duo-white',null,'duo-heart',null,'wings',null,'duo-view',null];
const ARCH=[
  ['duo-heart','50% 45%','56 times “бро” in six months. This is why.'],
  ['duo-wall','60% 40%','Waiting for someone to say “Вийдем на каву?”'],
  ['duo-car','55% 60%','No car: Parkland. Car: freedom.'],

  ['duo-white','50% 40%','Two saints. One wall.'],

];
[...Q_BG.filter(Boolean),'handshake'].forEach(n=>{const i=new Image();i.src='img/'+n+'.jpg'});
let bgFlip=false;
function setBg(name,strong){
  const a=document.getElementById('bgA'),b=document.getElementById('bgB');if(!a)return;
  const show=bgFlip?a:b,hide=bgFlip?b:a;bgFlip=!bgFlip;
  hide.classList.remove('on','strong');
  if(!name){show.classList.remove('on','strong');return}
  show.style.backgroundImage=`url(img/${name}.jpg)`;show.classList.toggle('strong',!!strong);
  requestAnimationFrame(()=>show.classList.add('on'));
}
function archive(){
  setBg(null);tag.textContent='The archive';setProg(Q.length);
  show(`<div class="eyebrow">Evidence on file</div>
  <h2>The archive</h2>
  <div class="slides" id="slides" role="region" aria-label="Photos of TalF Saints and sebii_sw">
    ${ARCH.map((a,i)=>`<figure class="slide${i?'':' on'}"><img src="img/${a[0]}.jpg" alt="" style="object-position:${a[1]}"><figcaption>${a[2]}</figcaption></figure>`).join('')}
    <div class="dots">${ARCH.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>
  </div>
  <p class="note">Tap the photo for the next one.</p>
  <button class="btn" id="toTest">One last test</button>`);
  const sl=[...document.querySelectorAll('.slide')],dots=[...document.querySelectorAll('.dots i')];let k=0;
  const go=n=>{sl[k].classList.remove('on');dots[k].classList.remove('on');k=(n+sl.length)%sl.length;sl[k].classList.add('on');dots[k].classList.add('on')};
  let t=setInterval(()=>go(k+1),3200);
  document.getElementById('slides').onclick=()=>{clearInterval(t);go(k+1);t=setInterval(()=>go(k+1),3200)};
  document.getElementById('toTest').onclick=()=>{clearInterval(t);challenge()};
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const x=c.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
  const W=()=>innerWidth,H=()=>innerHeight;c.width=W()*dpr;c.height=H()*dpr;x.scale(dpr,dpr);
  const cols=['#c6a46c','#e6cf9f','#8a2a3c','#5e1626','#f3ece0'];const P=[];
  const burst=(n,ox)=>{for(let i=0;i<n;i++)P.push({x:ox,y:H()*0.35,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,w:5+Math.random()*7,h:8+Math.random()*10,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]})};
  burst(140,W()*.5);setTimeout(()=>burst(90,W()*.2),450);setTimeout(()=>burst(90,W()*.8),800);
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,W(),H());P.forEach(p=>{p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r)));x.restore()});
    if(t-t0<5200)requestAnimationFrame(f);else c.remove()})(t0);
}
function track(e,k,v){try{if(window.clarity){if(k)clarity('set',k,String(v));clarity('event',e)}}catch(x){}}
(function(){
  const _intro=intro;intro=function(){_intro();setBg('jacket',true)};
  const _ask=ask;ask=function(i){_ask(i);setBg(Q_BG[i]||null);if(i===0)track('quiz_started')};
  const _gr=granting;granting=function(){_gr();setBg('jacket');track('quiz_finished','score',score+'/'+scored)};
  const _ch=challenge;challenge=function(){_ch();setBg('crouch');track('challenge_opened')};
  const _rec=record;record=function(f){setBg(null);return _rec(f)};
  const _tm=timer;timer=function(){_tm();setBg('wings')};
  const _ve=verify;verify=function(){_ve();setBg('wings');track('proof_submitted')};
  const _pr=proof;proof=function(){_pr();setBg(null)};
  const _rv=reveal;reveal=function(){_rv();track('gift_revealed');setBg(null);confetti();beep(1320,.3,.25);setTimeout(()=>say('Happy birthday, TalF Saints!'),400)};
})();

let musicOn=false;
function startMusic(){if(!music)return;musicOn=true;if(music.volume>.45||music.volume===1)music.volume=.45;music.play().catch(()=>{})}
/* Keep the music going: resume after any tap, when the tab comes back, or if the phone paused it. */
document.addEventListener('pointerdown',()=>{if(musicOn&&!window.musicHold&&music.paused)music.play().catch(()=>{})},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&musicOn&&!window.musicHold&&music.paused)music.play().catch(()=>{})});
music.addEventListener('pause',()=>{if(musicOn&&!window.musicHold&&!document.hidden)setTimeout(()=>music.play().catch(()=>{}),300)});
(function(){
  const gate=document.getElementById('gate');
  gate.addEventListener('click',()=>{startMusic();try{loadVoice()}catch(e){};gate.classList.add('out');setTimeout(()=>gate.remove(),700);const g=document.getElementById('go');if(g)g.focus({preventScroll:true})},{once:true});
  gate.focus();
})();
intro();
